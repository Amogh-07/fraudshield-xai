<!doctype html><html><head><meta charset="utf-8"><style>
body{width:340px;margin:0;padding:14px;font:14px system-ui,sans-serif;color:#111}
h3{margin:0 0 8px}.host{font-weight:600;word-break:break-all}.mu{color:#666;font-size:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:600}
.low{background:#2e7d32}.medium{background:#f57c00}.high{background:#d32f2f}
ul{margin:8px 0;padding-left:18px}button{margin:4px 6px 0 0;padding:6px 10px;cursor:pointer}
input{width:100%;box-sizing:border-box;padding:5px;margin:4px 0}hr{border:0;border-top:1px solid #ddd;margin:12px 0}
a{color:#1565c0;cursor:pointer}
</style></head><body>
<h3>FraudShield XAI</h3>
<div id="res" class="mu">Checking…</div>
<div id="actions" hidden>
  <button id="bad">Report as fraud</button><button id="ok">Looks safe</button>
  <div class="mu" id="msg"></div>
</div>
<button id="recheck">Check this page again</button>
<hr>
<div><a id="dash">Open analyst dashboard</a></div>
<div class="mu" style="margin-top:8px">API URL</div>
<input id="api" placeholder="http://localhost:8000"><button id="save">Save</button><span class="mu" id="saved"></span>
<script src="popup.js"></script></body></html>
